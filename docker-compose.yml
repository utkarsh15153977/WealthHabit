version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wealthhabit-postgres
    environment:
      POSTGRES_DB: wealthhabit
      POSTGRES_USER: wealthhabit
      POSTGRES_PASSWORD: wealthhabit
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthhabit -d wealthhabit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: